[DualHair]
Enabled=1
; Where the second colour begins, as a percentage of the way down the hair.
StartPercent=40
; How long the blend between the two colours is (0 = a hard split).
BlendPercent=35

[Characters]
; CharacterName=R,G,B  (the second hair colour; the first is the in-game hair colour)
; Set these in game with /hair2 R G B, /hair2 #RRGGBB or /hair2 off.
